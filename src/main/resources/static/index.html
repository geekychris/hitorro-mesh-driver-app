<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hitorro Mesh — Query Console</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            --bg: #0f1420;
            --panel: #161c2b;
            --border: #26314a;
            --text: #dfe4f0;
            --dim: #8892a6;
            --accent: #4d9fff;
            --accent-hover: #6ab0ff;
            --ok: #27c093;
            --warn: #e6c34a;
            --err: #ef6666;
            --mono: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body {
            background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 14px; line-height: 1.4;
        }
        .app { display: grid; grid-template-columns: 260px 1fr; grid-template-rows: 48px 1fr; height: 100vh; }
        header {
            grid-column: 1 / -1; background: var(--panel); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 20px; gap: 20px;
        }
        header h1 { font-size: 15px; margin: 0; font-weight: 600; }
        header h1 .dim { color: var(--dim); font-weight: 400; }
        header .status { margin-left: auto; display: flex; gap: 16px; align-items: center; color: var(--dim); font-size: 13px; }
        header .status .live { color: var(--ok); }
        header .status .warn { color: var(--warn); }
        aside {
            background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; padding: 16px 0;
        }
        aside h2 {
            font-size: 11px; letter-spacing: 0.05em; color: var(--dim); text-transform: uppercase;
            margin: 0 20px 8px; font-weight: 600;
        }
        aside .preset {
            padding: 10px 20px; cursor: pointer; border-left: 3px solid transparent;
        }
        aside .preset:hover { background: rgba(77, 159, 255, 0.06); }
        aside .preset.active { background: rgba(77, 159, 255, 0.12); border-left-color: var(--accent); }
        aside .preset .name { font-weight: 500; margin-bottom: 2px; }
        aside .preset .desc { color: var(--dim); font-size: 12px; }
        aside .agents { padding: 0 20px; margin-top: 16px; }
        aside .agent { padding: 6px 0; font-family: var(--mono); font-size: 12px; }
        aside .agent .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 8px; }
        aside .agent .caps { color: var(--dim); font-size: 11px; margin-left: 16px; }
        main { padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow: hidden; }
        .editor {
            background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
            padding: 12px; flex: 0 0 auto;
        }
        .editor textarea {
            width: 100%; background: transparent; color: var(--text); border: 0; outline: none; resize: vertical;
            font-family: var(--mono); font-size: 13px; min-height: 80px;
        }
        .toolbar { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
        button {
            background: var(--accent); color: white; border: 0; padding: 7px 16px; border-radius: 4px;
            font-weight: 500; cursor: pointer; font-size: 13px;
        }
        button:hover { background: var(--accent-hover); }
        button.secondary { background: transparent; color: var(--dim); border: 1px solid var(--border); }
        button.secondary:hover { color: var(--text); border-color: var(--dim); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .toolbar .meta { color: var(--dim); font-size: 12px; margin-left: auto; font-family: var(--mono); }
        .results {
            background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
            flex: 1 1 auto; overflow: auto; padding: 0;
        }
        .results.empty { padding: 20px; color: var(--dim); font-style: italic; }
        .results .err {
            padding: 16px; color: var(--err); font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word;
        }
        table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
        th {
            text-align: left; padding: 8px 12px; color: var(--dim); font-weight: 600;
            border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel);
        }
        td { padding: 6px 12px; border-bottom: 1px solid rgba(38, 49, 74, 0.4); }
        tr:hover td { background: rgba(77, 159, 255, 0.04); }
        .response-meta {
            padding: 8px 16px; background: rgba(77, 159, 255, 0.05); border-bottom: 1px solid var(--border);
            color: var(--dim); font-size: 12px; font-family: var(--mono);
        }
        .response-meta strong { color: var(--text); font-weight: 500; }
    </style>
</head>
<body>
<div class="app">
    <header>
        <h1>Hitorro Mesh <span class="dim">— Query Console</span></h1>
        <div class="status">
            <span id="agents-count" class="warn">agents: …</span>
            <span id="tables-count" class="dim">tables: …</span>
            <span id="last-latency" class="dim"></span>
        </div>
    </header>
    <aside>
        <h2>Presets</h2>
        <div id="presets"></div>
        <h2 style="margin-top:24px">Live agents</h2>
        <div id="agents" class="agents"></div>
        <h2 style="margin-top:24px">Tables</h2>
        <div id="tables" class="agents"></div>
    </aside>
    <main>
        <div class="editor">
            <textarea id="sql" spellcheck="false"
                      placeholder="SELECT id, title FROM docs WHERE lang = 'en'"></textarea>
            <div class="toolbar">
                <button id="run">▶ Run</button>
                <button id="clear" class="secondary">Clear</button>
                <span class="meta" id="query-meta"></span>
            </div>
        </div>
        <div id="results" class="results empty">Run a query to see results.</div>
    </main>
</div>

<script>
'use strict';

const PRESETS = [
    {
        name: 'Filter — English docs',
        desc: 'Phase-1 distributed WHERE, union at driver.',
        sql: "SELECT id, title FROM docs WHERE lang = 'en'"
    },
    {
        name: 'Filter — large files',
        desc: 'WHERE across all partitions.',
        sql: "SELECT id, title, lang, size_kb FROM docs WHERE size_kb > 200"
    },
    {
        name: 'Aggregate — count by language',
        desc: 'Phase-2 GROUP BY, combiner at driver. Correct GLOBAL counts.',
        sql: "SELECT lang, COUNT(*) FROM docs GROUP BY lang"
    },
    {
        name: 'Aggregate — sum + count together',
        desc: 'Multiple aggregates in one query.',
        sql: "SELECT lang, COUNT(*), SUM(size_kb) FROM docs WHERE lang = 'en' GROUP BY lang"
    },
    {
        name: 'Aggregate — min & max size',
        desc: 'MIN/MAX combine correctly across partitions.',
        sql: "SELECT lang, MIN(size_kb), MAX(size_kb) FROM docs GROUP BY lang"
    },
    {
        name: 'Aggregate — AVG (phase 3)',
        desc: 'AVG decomposes to SUM+COUNT partials, division at combine.',
        sql: "SELECT lang, AVG(size_kb) FROM docs GROUP BY lang"
    },
    {
        name: 'SELECT DISTINCT (phase 3)',
        desc: 'Deduplicates across partitions via GROUP BY rewrite.',
        sql: "SELECT DISTINCT lang FROM docs"
    },
    {
        name: 'HAVING (phase 3)',
        desc: 'Post-aggregate filter, rewritten to combine columns.',
        sql: "SELECT lang, COUNT(*) FROM docs GROUP BY lang HAVING COUNT(*) > 1"
    },
    {
        name: 'Broadcast JOIN (phase 4a)',
        desc: 'JOIN against a broadcast dimension table pre-loaded on every agent.',
        sql: "SELECT docs.id, docs.lang, langs.name FROM docs JOIN langs ON docs.lang = langs.code"
    },
    {
        name: 'Broadcast JOIN + GROUP BY (phase 4a)',
        desc: 'Aggregate on a broadcast column — join runs per-partition, combine aggregates globally.',
        sql: "SELECT langs.name, COUNT(*) FROM docs JOIN langs ON docs.lang = langs.code GROUP BY langs.name"
    },
    {
        name: 'LIMIT (phase 5a)',
        desc: 'Driver-side cap on result rows — works across every plan shape.',
        sql: "SELECT id, title, lang FROM docs LIMIT 3"
    },
    {
        name: 'ORDER BY (phase 5b)',
        desc: 'Distributed sort — agents sort locally, driver merges globally.',
        sql: "SELECT id, size_kb FROM docs ORDER BY size_kb DESC"
    },
    {
        name: 'ORDER BY + LIMIT — top-N (phase 5b)',
        desc: 'Classic "top-N" query: largest documents across all partitions.',
        sql: "SELECT id, title, size_kb FROM docs ORDER BY size_kb DESC LIMIT 3"
    },
    {
        name: 'ORDER BY + GROUP BY (phase 5b.1)',
        desc: 'Top languages by document count — sort composes with every plan.',
        sql: "SELECT lang, COUNT(*) FROM docs GROUP BY lang ORDER BY c0 DESC LIMIT 3"
    },
    {
        name: 'Windowed aggregation (phase 6d)',
        desc: 'Function-call GROUP BY — bucket docs by 100KB size, count per bucket, sort ascending.',
        sql: "SELECT WIN_START(size_kb, 100), COUNT(*) FROM docs GROUP BY WIN_START(size_kb, 100) ORDER BY g0"
    },
    {
        name: 'Guard — non-broadcast JOIN rejected here',
        desc: 'The demo cluster only has one distributed table, so this JOIN has nothing to shuffle against.',
        sql: "SELECT * FROM docs JOIN other ON docs.id = other.id"
    }
];

const $ = (id) => document.getElementById(id);

let activePreset = null;

function renderPresets() {
    const el = $('presets');
    el.innerHTML = '';
    PRESETS.forEach((p, i) => {
        const div = document.createElement('div');
        div.className = 'preset' + (activePreset === i ? ' active' : '');
        div.innerHTML = `<div class="name">${p.name}</div><div class="desc">${p.desc}</div>`;
        div.onclick = () => {
            activePreset = i;
            $('sql').value = p.sql;
            renderPresets();
        };
        el.appendChild(div);
    });
}

async function refreshStatus() {
    try {
        const [agentsResp, tablesResp] = await Promise.all([
            fetch('/mesh/agents').then(r => r.json()),
            fetch('/mesh/tables').then(r => r.json())
        ]);
        const ac = $('agents-count');
        ac.textContent = `agents: ${agentsResp.length}`;
        ac.className = agentsResp.length > 0 ? 'live' : 'warn';

        $('tables-count').textContent = `tables: ${tablesResp.length}`;

        const agentsEl = $('agents');
        agentsEl.innerHTML = agentsResp.length === 0
            ? '<div class="agent" style="color:var(--dim)">none live</div>'
            : agentsResp.map(a => `
                <div class="agent">
                    <span class="dot"></span>${a.agentId}
                    <div class="caps">${(a.capabilities || []).join(', ')}</div>
                </div>`).join('');

        const tablesEl = $('tables');
        tablesEl.innerHTML = tablesResp.length === 0
            ? '<div class="agent" style="color:var(--dim)">none registered</div>'
            : tablesResp.map(t => {
                const parts = (t.partitions || []).map(p => p.key).join(', ');
                return `<div class="agent"><span class="dot" style="background:var(--accent)"></span>${t.name}<div class="caps">partitions: ${parts}</div></div>`;
            }).join('');
    } catch (e) {
        $('agents-count').textContent = 'agents: ?';
        $('agents-count').className = 'warn';
    }
}

async function runQuery() {
    const sql = $('sql').value.trim();
    if (!sql) return;
    const btn = $('run');
    btn.disabled = true;
    btn.textContent = '● Running…';
    $('query-meta').textContent = '';
    const started = performance.now();
    try {
        const resp = await fetch('/mesh/queries', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({sql, timeoutMs: 10000})
        });
        const dtMs = (performance.now() - started).toFixed(0);
        const body = await resp.json();
        if (!resp.ok || body.error) {
            renderError(body.error || `HTTP ${resp.status}`);
            $('query-meta').textContent = `${dtMs}ms`;
        } else {
            renderResults(body, dtMs);
            $('query-meta').textContent = `${body.rowCount} row(s)  ·  ${dtMs}ms  ·  agents: ${(body.assignedAgents || []).join(', ')}`;
            $('last-latency').textContent = `last: ${dtMs}ms`;
        }
    } catch (e) {
        renderError(String(e));
    } finally {
        btn.disabled = false;
        btn.textContent = '▶ Run';
    }
}

function renderError(msg) {
    const el = $('results');
    el.classList.remove('empty');
    el.innerHTML = `<div class="err">✗ ${escapeHtml(msg)}</div>`;
}

function renderResults(body, dtMs) {
    const el = $('results');
    el.classList.remove('empty');
    const rows = body.rows || [];
    if (rows.length === 0) {
        el.innerHTML = `
            <div class="response-meta">
                query <strong>${body.queryId}</strong>  ·  0 rows  ·  ${dtMs}ms  ·  agents: <strong>${(body.assignedAgents || []).join(', ')}</strong>
            </div>
            <div class="err" style="color:var(--dim)">no rows returned</div>`;
        return;
    }
    // Union of all column names across rows.
    const cols = Array.from(rows.reduce((set, r) => {
        Object.keys(r).forEach(k => set.add(k));
        return set;
    }, new Set()));
    const head = cols.map(c => `<th>${escapeHtml(c)}</th>`).join('');
    const bodyHtml = rows.map(r =>
        `<tr>${cols.map(c => `<td>${formatValue(r[c])}</td>`).join('')}</tr>`).join('');
    el.innerHTML = `
        <div class="response-meta">
            query <strong>${body.queryId}</strong>  ·  <strong>${rows.length}</strong> rows  ·  ${dtMs}ms  ·  agents: <strong>${(body.assignedAgents || []).join(', ')}</strong>
        </div>
        <table>
            <thead><tr>${head}</tr></thead>
            <tbody>${bodyHtml}</tbody>
        </table>`;
}

function formatValue(v) {
    if (v === null || v === undefined) return '<span style="color:var(--dim)">null</span>';
    if (typeof v === 'object') return `<span style="color:var(--dim)">${escapeHtml(JSON.stringify(v))}</span>`;
    return escapeHtml(String(v));
}

function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// wire it up
renderPresets();
refreshStatus();
setInterval(refreshStatus, 3000);
$('run').onclick = runQuery;
$('clear').onclick = () => {
    $('sql').value = '';
    $('results').className = 'results empty';
    $('results').textContent = 'Run a query to see results.';
    $('query-meta').textContent = '';
    activePreset = null;
    renderPresets();
};
$('sql').addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') runQuery();
});
// Kick off with the first preset selected.
activePreset = 0;
$('sql').value = PRESETS[0].sql;
renderPresets();
</script>
</body>
</html>
