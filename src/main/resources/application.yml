spring:
  application:
    name: hitorro-mesh-driver
  main:
    banner-mode: off
  # Spring MVC writes JSON with Boot's Jackson 3 JsonMapper. Keep the format the app had on
  # Jackson 2 (Boot's Jackson 2 mapper): Jackson 2 defaults + Boot's (ISO dates, unknown
  # properties ignored) and Jackson 2.18's stream limits. See Jackson2CompatConfig.
  jackson:
    use-jackson2-defaults: true
    factory:
      constraints:
        read:
          max-nesting-depth: 1000
          max-string-length: 20000000
        write:
          max-nesting-depth: 1000

server:
  port: 8085

logging:
  level:
    root: INFO
    com.hitorro.mesh: INFO

management:
  endpoints:
    # Actuator JSON comes from Jackson2CompatConfig.hitorroEndpointJsonMapper (Jackson 2's format); Jackson2Defaults sets these too, for deployments that replace this file.
    jackson:
      isolated-json-mapper: false
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: hitorro-mesh-driver

hitorro:
  mesh:
    driver:
      transport: nats
      nats-url: nats://localhost:4222
      agent-expiry: 15s
