spring:
  application:
    name: hitorro-mesh-driver
  main:
    banner-mode: off

server:
  port: 8085

logging:
  level:
    root: INFO
    com.hitorro.mesh: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: hitorro-mesh-driver

hitorro:
  mesh:
    driver:
      transport: nats
      nats-url: nats://localhost:4222
      agent-expiry: 15s
